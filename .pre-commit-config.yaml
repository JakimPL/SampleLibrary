repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types: [text]
      - id: check-yaml

  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]

      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        require_serial: true
        exclude: ^(tests/)
        stages: [pre-push]
        pass_filenames: false

      - id: pylint
        name: pylint
        entry: uv run pylint src scripts
        language: system
        types: [python]
        require_serial: true
        exclude: ^(tests/)
        stages: [pre-push]
        pass_filenames: false

      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        stages: [pre-push]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest -n auto
        language: system
        types: [python]
        stages: [pre-push]
        pass_filenames: false

      - id: frontend-typecheck
        name: frontend-typecheck
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/
        stages: [pre-push]
        pass_filenames: false

      - id: frontend-lint
        name: frontend-lint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        stages: [pre-push]
        pass_filenames: false

      - id: vitest
        name: vitest
        entry: npm --prefix frontend run test
        language: system
        files: ^frontend/
        stages: [pre-push]
        pass_filenames: false
