[project]
name = "samplelibrary"
version = "0.0.1"
description = "Personal library and web application for tracker music samples"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jakim" }]

dependencies = [
    "numpy>=2.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "pytz>=2025.2",
    "scipy>=1.16",
    "soundfile>=0.14",
    "sqlalchemy>=2.0",
    "tqdm>=4.67",
    "trackmod",
]

[project.optional-dependencies]
server = ["fastapi>=0.120", "uvicorn>=0.35"]
cloud = ["librosa>=0.11", "umap-learn>=0.5", "scikit-learn>=1.9"]

[project.scripts]
sampleextract = "sampleextract.cli:main"
sampleequivalence = "sampleextract.equivalence.cli:main"
samplethumbnail = "sampleextract.thumbnail_cli:main"
samplenotes = "sampleextract.notes.cli:main"
samplecloud = "samplecloud.cli:main"
samplecloud-modules-placeholder = "samplecloud.placeholder_modules:main"
sampleserver-schema = "sampleserver.openapi_export:main"

[tool.uv.sources]
trackmod = { path = "trackmod", editable = true }

[dependency-groups]
dev = [
    "black==26.5.1",
    "isort==8.0.1",
    "mypy==2.1.0",
    "pylint==4.0.6",
    "pylint-pydantic==0.4.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "httpx>=0.28",
    "import-linter>=2.5",
    "pre-commit==4.6.0",
    "marimo>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samplecore", "src/sampleextract", "src/samplecloud", "src/sampleserver"]

[tool.hatch.build.targets.wheel.force-include]
"src/samplecore/py.typed" = "samplecore/py.typed"
"src/sampleextract/py.typed" = "sampleextract/py.typed"
"src/samplecloud/py.typed" = "samplecloud/py.typed"
"src/sampleserver/py.typed" = "sampleserver/py.typed"

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "trackmod"

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["samplecore", "sampleextract", "samplecloud", "sampleserver"]
known_third_party = ["trackmod"]
skip = ["trackmod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["samplecore", "sampleextract", "samplecloud", "sampleserver"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
exclude = ["tests"]
disallow_subclassing_any = true
ignore_missing_imports = true
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pylint.main]
load-plugins = ["pylint_pydantic"]
ignore-paths = ['(.*/)?notebooks/[^/]+\.py$', '^trackmod/.*$']

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-public-methods",
    "too-many-locals",
]

[tool.pylint.format]
max-line-length = 120

[tool.importlinter]
root_packages = ["samplecore", "sampleextract", "samplecloud", "sampleserver"]

[[tool.importlinter.contracts]]
name = "core has no dependents among peer packages"
type = "forbidden"
source_modules = ["samplecore"]
forbidden_modules = ["sampleextract", "samplecloud", "sampleserver"]

[[tool.importlinter.contracts]]
name = "server never imports the offline batch pipelines"
type = "forbidden"
source_modules = ["sampleserver"]
forbidden_modules = ["sampleextract", "samplecloud"]

[[tool.importlinter.contracts]]
name = "extraction and cloud pipelines stay independent"
type = "independence"
modules = ["sampleextract", "samplecloud"]
