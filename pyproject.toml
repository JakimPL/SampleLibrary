[project]
name = "samplelibrary"
version = "0.0.1"
description = "Personal library and web application for tracker music samples"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jakim" }]

dependencies = [
    "numpy>=2.1",
    "platformdirs>=4.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "pytz>=2025.2",
    "scipy>=1.16",
    "soundfile>=0.14",
    "sqlalchemy>=2.0",
    "tomlkit>=0.13",
    "tqdm>=4.67",
    "trackmod",
]

[project.optional-dependencies]
server = ["fastapi>=0.120", "uvicorn>=0.35", "httpx>=0.28"]
cloud = ["librosa>=0.11", "umap-learn>=0.5", "scikit-learn>=1.9", "mlflow>=3.6"]
morph = [
    "librosa>=0.11",
    "pghipy>=0.1",
    "fastapi>=0.120",
    "uvicorn>=0.35",
    "pyyaml>=6.0",
    "python-multipart>=0.0.20",
]
descriptor = [
    "librosa>=0.11",
    "scikit-learn>=1.9",
    "torch>=2.9",
    "lightning>=2.5",
    "threadpoolctl>=3.6",
    "mlflow>=3.6",
]
tracking = ["mlflow>=3.6"]
teacher = ["torch>=2.9", "transformers>=4.45"]
app = ["postgresql-binaries>=18.6"]

[project.scripts]
samplelibrary = "samplelibrary.cli:main"

# The card is sm_120, which needs a CUDA 12.8 or newer build.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
trackmod = { path = "trackmod", editable = true }
# macOS takes torch from PyPI, since the CUDA index publishes no macOS wheels.
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[dependency-groups]
dev = [
    "black==26.5.1",
    "codespell==2.4.3",
    "isort==8.0.1",
    "mypy==2.1.0",
    "pylint==4.0.6",
    "pylint-pydantic==0.4.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "httpx>=0.28",
    "import-linter>=2.5",
    "pre-commit==4.6.0",
    "marimo>=0.23",
    "hypothesis==6.168.0",
    "types-pyyaml==6.0.12.20260906",
    "threadpoolctl>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The bundled descriptor stays out of git and still ships in every wheel built after `just bundle-descriptor`.
artifacts = ["src/sampledescriptor/pretrained/*"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/samplecore",
    "src/sampleextract",
    "src/samplecloud",
    "src/sampleserver",
    "src/samplemorph",
    "src/sampledescriptor",
    "src/samplelibrary",
]

[tool.hatch.build.targets.wheel.force-include]
"src/samplecore/py.typed" = "samplecore/py.typed"
"src/sampleextract/py.typed" = "sampleextract/py.typed"
"src/samplecloud/py.typed" = "samplecloud/py.typed"
"src/sampleserver/py.typed" = "sampleserver/py.typed"
"src/samplemorph/py.typed" = "samplemorph/py.typed"
"src/sampledescriptor/py.typed" = "sampledescriptor/py.typed"
"src/samplelibrary/py.typed" = "samplelibrary/py.typed"

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "trackmod"

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["samplecore", "sampleextract", "samplecloud", "sampleserver", "samplemorph", "sampledescriptor", "samplelibrary"]
known_third_party = ["trackmod"]
skip = ["trackmod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not pipeline_real and not pipeline_explore'"
markers = [
    "pipeline_real: runs the pipeline's real programs, listening model and training included; `just test-pipeline` runs them",
    "pipeline_explore: acts on a library in orders Hypothesis draws, for minutes; `just explore-pipeline` runs it",
]

[tool.coverage.run]
source = ["samplecore", "sampleextract", "samplecloud", "sampleserver", "samplemorph", "sampledescriptor", "samplelibrary"]
# Extraction's worker processes count only when coverage follows multiprocessing's children.
concurrency = ["multiprocessing", "thread"]
sigterm = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
exclude = ["tests"]
disallow_subclassing_any = true
ignore_missing_imports = true
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pylint.main]
load-plugins = ["pylint_pydantic"]
ignore-paths = ['(.*/)?notebooks/[^/]+\.py$', '^trackmod/.*$']

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-public-methods",
    "too-many-locals",
]

[tool.pylint.format]
max-line-length = 120

[tool.importlinter]
root_packages = [
    "samplecore",
    "sampleextract",
    "samplecloud",
    "sampleserver",
    "samplemorph",
    "sampledescriptor",
    "samplelibrary",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "the command line sits over every package, and none of them imports it"
type = "forbidden"
source_modules = ["samplecore", "sampleextract", "samplecloud", "sampleserver", "samplemorph", "sampledescriptor"]
forbidden_modules = ["samplelibrary"]

[[tool.importlinter.contracts]]
name = "the application runs the pipelines and the renderer as programs of their own, and stays light"
type = "forbidden"
source_modules = ["samplelibrary.app"]
forbidden_modules = ["samplecloud", "sampledescriptor", "samplemorph", "torch", "librosa"]

[[tool.importlinter.contracts]]
name = "the memory ceiling boundary reaches the core alone"
type = "forbidden"
source_modules = ["samplelibrary.limits"]
forbidden_modules = ["sampleextract", "samplecloud", "sampleserver", "samplemorph", "sampledescriptor"]

[[tool.importlinter.contracts]]
name = "core has no dependents among peer packages"
type = "forbidden"
source_modules = ["samplecore"]
forbidden_modules = ["sampleextract", "samplecloud", "sampleserver", "samplemorph", "sampledescriptor"]

[[tool.importlinter.contracts]]
name = "server never imports the offline batch pipelines"
type = "forbidden"
source_modules = ["sampleserver"]
forbidden_modules = ["sampleextract", "samplecloud", "samplemorph", "sampledescriptor"]

[[tool.importlinter.contracts]]
name = "the offline pipelines never import the server, which reads what they write"
type = "forbidden"
source_modules = ["sampleextract", "samplecloud", "samplemorph", "sampledescriptor"]
forbidden_modules = ["sampleserver"]

[[tool.importlinter.contracts]]
name = "extraction stays independent of the embedding pipelines"
type = "independence"
modules = ["sampleextract", "samplecloud"]

[[tool.importlinter.contracts]]
name = "extraction stays independent of the morph pipeline"
type = "independence"
modules = ["sampleextract", "samplemorph"]

[[tool.importlinter.contracts]]
name = "extraction stays independent of the descriptor pipeline"
type = "independence"
modules = ["sampleextract", "sampledescriptor"]

[[tool.importlinter.contracts]]
name = "the morph and descriptor pipelines never import the cloud, which is the layer over them"
type = "forbidden"
source_modules = ["samplemorph", "sampledescriptor"]
forbidden_modules = ["samplecloud"]

[[tool.importlinter.contracts]]
name = "the morph renderer never reaches the descriptor, the run tracking or the training stack"
type = "forbidden"
source_modules = ["samplemorph"]
forbidden_modules = [
    "sampledescriptor",
    "samplecore.tracking",
    "torch",
    "lightning",
    "mlflow",
    "sklearn",
    "threadpoolctl",
]

[[tool.importlinter.contracts]]
name = "the morph service is the pipeline over HTTP, clear of the shell and of every other package"
type = "forbidden"
source_modules = ["samplemorph.service"]
forbidden_modules = ["samplemorph.commands", "sampleextract", "samplecloud", "sampleserver"]

[[tool.importlinter.contracts]]
name = "the morph shell and the morph service are two skins over one pipeline"
type = "independence"
modules = ["samplemorph.commands", "samplemorph.service"]

[[tool.importlinter.contracts]]
name = "the transport is the analysis the envelope morph stands on, and stands on its own"
type = "forbidden"
source_modules = ["samplemorph.transport"]
forbidden_modules = ["samplemorph.envelope", "samplemorph.routes", "samplemorph.service"]

[[tool.importlinter.contracts]]
name = "the envelope morph is read by the routes, the shell and the service, and reads none of them"
type = "forbidden"
source_modules = ["samplemorph.envelope"]
forbidden_modules = ["samplemorph.routes", "samplemorph.commands", "samplemorph.service"]

[[tool.importlinter.contracts]]
name = "the pitch readers are read by the routes, and read none of the layers over them"
type = "forbidden"
source_modules = ["samplemorph.coordinates"]
forbidden_modules = [
    "samplemorph.routes",
    "samplemorph.commands",
    "samplemorph.service",
    "samplemorph.envelope",
    "samplemorph.transport",
]
