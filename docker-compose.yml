# Local development only -- see docs/architecture.md's "Deployment" section for how `sampleserver`
# and Postgres actually relate in a real deployment. LIBRARY_ROOT and CONFIG_PATH must point at your
# own local library directory and config.toml before running `docker compose up`.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: samplelibrary
      POSTGRES_PASSWORD: samplelibrary
      POSTGRES_DB: samplelibrary
    # POSTGRES_PORT moves the published port where a Postgres installed on the machine already
    # holds 5432: `POSTGRES_PORT=5433 docker compose up -d postgres`, with config.toml's
    # database_url naming the same port.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP rather than the socket: while the image sets a new cluster up it runs a temporary
      # server listening on the socket alone, so a socket probe reports healthy before the server
      # this depends on is actually accepting connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U samplelibrary"]
      interval: 5s
      timeout: 5s
      retries: 10

  sampleserver:
    build: .
    ports:
      - "8000:8000"
    # Defaults so the file validates when only `postgres` is wanted -- Compose reads every service
    # whichever one is started. Starting `sampleserver` itself wants the real paths.
    volumes:
      - ${LIBRARY_ROOT:-./library}:/library
      - ${CONFIG_PATH:-./config.toml}:/app/config.toml
    environment:
      SAMPLELIBRARY_CONFIG: /app/config.toml
      SAMPLELIBRARY_DATABASE_URL: postgresql+psycopg://samplelibrary:samplelibrary@postgres:5432/samplelibrary
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
