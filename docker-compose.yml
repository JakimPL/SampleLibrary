# The site as a hosting platform runs it, beside a database of its own, on this computer alone: a
# rehearsal of what visitors will see. `just docker-secrets` writes the two files the passwords come
# from, `just docker-publish` publishes a library into the database, and `docker compose up site`
# serves it on http://127.0.0.1:8000.
services:
  postgres:
    image: postgres:17-alpine
    # The superuser's password, which the site's container is never handed.
    env_file:
      - path: docker/postgres.env
        required: true
    environment:
      POSTGRES_USER: samplelibrary
      POSTGRES_DB: samplelibrary
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: while the image initializes a cluster, a temporary server answers on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U samplelibrary"]
      interval: 5s
      timeout: 5s
      retries: 10

  site:
    build: .
    image: samplelibrary-site
    # The reader's connection, SAMPLELIBRARY_SERVER_DATABASE_URL, and nothing that could change the catalog.
    env_file:
      - path: docker/site.env
        required: true
    environment:
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    # The folder `samplelibrary publish` gathers the audio in, read-only where a platform mounts its
    # volume. A path that is not there fails the start rather than mounting an empty directory.
    volumes:
      - type: bind
        source: ${PUBLICATION:-./library/publication}
        target: /library
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
