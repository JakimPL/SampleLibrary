services:
  postgres:
    image: postgres:17-alpine
    # `just docker-secrets` writes the superuser's password into this file, which the server's
    # container alone reads; compose refuses to start without it.
    env_file:
      - path: docker/postgres.env
        required: true
    environment:
      POSTGRES_USER: samplelibrary
      POSTGRES_DB: samplelibrary
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: while the image initializes a cluster, a temporary server answers on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U samplelibrary"]
      interval: 5s
      timeout: 5s
      retries: 10

  sampleserver:
    build: .
    image: samplelibrary-server
    ports:
      - "127.0.0.1:8000:8000"
    # Compose validates every service, so these defaults let `postgres` start alone. A path that is
    # not there fails the start rather than leaving an empty directory mounted in its place.
    volumes:
      - type: bind
        source: ${LIBRARY_ROOT:-./library}
        target: /library
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CONFIG_PATH:-./docker/config.toml}
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      # Samples found in sample directories are read in place, and the catalog names each directory
      # by the path it was scanned under, so each one is mounted at that same path, read-only:
      # - type: bind
      #   source: /home/you/Samples/Packs
      #   target: /home/you/Samples/Packs
      #   read_only: true
    # The server connects as the role that reads alone. `just docker-secrets` writes its connection,
    # SAMPLELIBRARY_SERVER_DATABASE_URL, into this file with a password of its own; compose refuses
    # to start without it. `samplelibrary setup database` creates the role from the same URL.
    env_file:
      - path: docker/site.env
        required: true
    # Lets `[inference] url = "http://host.docker.internal:8010"` reach a renderer on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
