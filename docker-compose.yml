services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: samplelibrary
      POSTGRES_PASSWORD: samplelibrary
      POSTGRES_DB: samplelibrary
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: while the image initializes a cluster, a temporary server answers on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U samplelibrary"]
      interval: 5s
      timeout: 5s
      retries: 10

  sampleserver:
    build: .
    ports:
      - "8000:8000"
    # Compose validates every service, so these defaults let `postgres` start alone.
    volumes:
      - ${LIBRARY_ROOT:-./library}:/library
      - ${CONFIG_PATH:-./config.toml}:/app/config.toml
    environment:
      SAMPLELIBRARY_CONFIG: /app/config.toml
      SAMPLELIBRARY_DATABASE_URL: postgresql+psycopg://samplelibrary:samplelibrary@postgres:5432/samplelibrary
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
