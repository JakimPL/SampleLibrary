# Paths inside the container; compose supplies the database through SAMPLELIBRARY_DATABASE_URL.
[library]
module_source_directory = "/modules"
library_root = "/library"

# Sample directories keep the paths they were scanned under, and docker-compose.yml mounts each one
# at that same path.
# sample_directories = ["/home/you/Samples/Packs"]

# A morph renderer runs on the host. Under compose the container reaches the host through the
# address Docker gives it, and under `just docker-run` on Linux the container shares the host's
# network, where the default http://127.0.0.1:8010 already names it.
# [inference]
# url = "http://host.docker.internal:8010"
