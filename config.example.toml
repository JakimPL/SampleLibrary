# Copy this file to config.toml (gitignored) and fill in your own local paths below.
# Paths are read by pathlib.Path, so either forward slashes or your platform's native
# separator work: "/home/you/modules", "M:/Muzyka/Moduly", "C:\\Users\\you\\Modules".

[library]
# Directory containing your tracker module collection, scanned recursively for .xm/.it files.
module_source_directory = "/path/to/your/module/collection"

# Directory where extracted sample audio is stored.
library_root = "/path/to/your/sample/library"

# The catalog's Postgres connection URL. `make database` reads the role, the password and the
# server from here and creates whatever of them the server is missing, so these credentials are as
# good as any on a local machine. Can instead (or additionally, taking precedence) be supplied via
# the SAMPLELIBRARY_DATABASE_URL environment variable, so credentials never need to live in this
# file.
database_url = "postgresql+psycopg://samplelibrary:samplelibrary@localhost:5432/samplelibrary"

# Samples shorter than this many frames are skipped at ingest time. Defaults to 512.
# minimum_sample_frames = 512
